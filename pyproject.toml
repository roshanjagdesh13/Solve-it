[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesolver"
version = "1.0.0"
description = "AI-powered CLI tool that solves questions from images, PDFs, and text files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "File Solver Contributors" }]
keywords = ["ai", "solver", "ocr", "pdf", "cli", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "openai>=1.30",
    "pypdf>=4.0",
    "Pillow>=10.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
filesolver = "filesolver.cli.main:cli"

[project.urls]
Homepage = "https://github.com/your-username/file-solver"
Repository = "https://github.com/your-username/file-solver"
Issues = "https://github.com/your-username/file-solver/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
